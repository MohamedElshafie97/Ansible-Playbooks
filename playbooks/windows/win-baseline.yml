---
# Baseline settings for Windows Server: time sync, RDP with NLA,
# firewall profiles on, SMBv1 off, event log sizes, a few common tools.
- name: Windows Server baseline
  hosts: windows
  vars:
    win_timezone: Egypt Standard Time
    win_ntp_peers: "0.pool.ntp.org,0x8 1.pool.ntp.org,0x8"
    win_security_log_mb: 1024
    win_features_absent:
      - FS-SMB1
      - PowerShell-V2
    win_choco_packages:
      - 7zip
      - notepadplusplus
      - sysinternals

  tasks:
    - name: Set time zone
      community.windows.win_timezone:
        timezone: "{{ win_timezone }}"

    - name: Point W32Time at NTP peers (non-domain hosts only)
      ansible.windows.win_shell: |
        w32tm /config /manualpeerlist:"{{ win_ntp_peers }}" /syncfromflags:manual /update
        Restart-Service w32time
        w32tm /resync /force
      when: ansible_windows_domain_member is not defined or not ansible_windows_domain_member
      changed_when: true

    - name: Enable RDP
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Require Network Level Authentication for RDP
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 1
        type: dword

    - name: Turn on all firewall profiles
      community.windows.win_firewall:
        state: enabled
        profiles: [Domain, Private, Public]

    - name: Allow RDP through the firewall
      community.windows.win_firewall_rule:
        name: Remote Desktop - User Mode (TCP-In)
        enabled: true
        state: present
        localport: 3389
        action: allow
        direction: in
        protocol: tcp

    - name: Remove legacy features
      ansible.windows.win_feature:
        name: "{{ win_features_absent }}"
        state: absent
      register: win_feature_result

    - name: Disable SMBv1 server protocol
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: SMB1
        data: 0
        type: dword

    - name: Increase Security event log size
      community.windows.win_eventlog:
        name: Security
        maximum_size: "{{ win_security_log_mb }}MB"
        overflow_action: OverwriteAsNeeded

    - name: Install common admin tools
      chocolatey.chocolatey.win_chocolatey:
        name: "{{ win_choco_packages }}"
        state: present
      when: win_choco_packages | length > 0

    - name: Reboot if feature removal needs it
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when: win_feature_result.reboot_required | default(false)
