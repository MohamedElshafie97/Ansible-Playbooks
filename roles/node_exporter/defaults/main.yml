---
node_exporter_version: "1.8.2"
node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
node_exporter_base_url: https://github.com/prometheus/node_exporter/releases/download
node_exporter_url: "{{ node_exporter_base_url }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
node_exporter_listen: "0.0.0.0:9100"
node_exporter_user: node_exporter
node_exporter_bin: /usr/local/bin/node_exporter
node_exporter_textfile_dir: /var/lib/node_exporter/textfile
node_exporter_collectors:
  - systemd
  - processes
  - "textfile.directory={{ node_exporter_textfile_dir }}"
# Only this address may scrape port 9100 (your Prometheus server)
node_exporter_allowed_source: ""
