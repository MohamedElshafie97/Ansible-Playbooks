---
- name: Ensure OpenSSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Check that the connecting user has an authorized key
  ansible.builtin.stat:
    path: "~{{ ansible_user | default(lookup('env', 'USER')) }}/.ssh/authorized_keys"
  register: ssh_authorized_keys
  when: ssh_check_keys_before_disabling_passwords

- name: Stop here rather than lock ourselves out
  ansible.builtin.assert:
    that:
      - ssh_authorized_keys.stat.exists
      - ssh_authorized_keys.stat.size > 0
    fail_msg: >-
      No authorized_keys for {{ ansible_user | default('current user') }} on {{ inventory_hostname }}.
      Copy a key first or set ssh_password_authentication=yes.
  when:
    - ssh_check_keys_before_disabling_passwords
    - ssh_password_authentication == "no"

- name: Back up the original sshd_config once
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.orig
    remote_src: true
    force: false
    mode: "0600"

- name: Make sure sshd reads drop-in files
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Deploy hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Deploy pre-login banner
  ansible.builtin.copy:
    dest: "{{ ssh_banner_path }}"
    content: |
      Authorized access only. Activity on this system is monitored and logged.
    owner: root
    group: root
    mode: "0644"

- name: Allow non-default SSH port in SELinux
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status | default('disabled') == "enabled"
    - ssh_port | int != 22

- name: Open SSH port (firewalld)
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_os_family == "RedHat"

- name: Open SSH port (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: ansible_os_family == "Debian"
